server:
  port: 8080

spring:
  application:
    name: virtual-try-on-service
  datasource:
    url: jdbc:h2:mem:fashiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 20MB

# Custom AI Engine Configuration
ai:
  tryon:
    mock-mode: true
    model-provider: "IDM-VTON-Simulation" # Or "replicate", "huggingface", "local-diffusion"
    api-key: "demo-api-key"
    external-endpoint: "https://api.replicate.com/v1/predictions"
    simulated-delay-ms: 1800

# OpenAPI Swagger Docs
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
