server:
  port: 8080

spring:
  application:
    name: virtual-try-on-service
  datasource:
    url: jdbc:h2:mem:fashiondb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

# ==============================================================================
# CẤU HÌNH KẾT NỐI MÔ HÌNH THỬ ĐỒ ẢO CatVTON TRÊN KAGGLE T4 GPU
# ==============================================================================
ai:
  tryon:
    mock-mode: false # Đã bật chạy thật với GPU của Kaggle
    model-provider: "CatVTON"
    # Link ngrok thực tế đang chạy trên Kaggle của bạn:
    catvton-api-url: "https://crouch-frame-reason.ngrok-free.dev/api/v1/tryon"
    simulated-delay-ms: 1500

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
